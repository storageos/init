name: Publish release image

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-image:
    runs-on: self-hosted
    name: Publish container image
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set image tag env var
        # Refer https://stackoverflow.com/a/58178121 for git tag extraction.
        run: echo "IMAGE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Set image env vars
        run: |
          echo "IMAGE=storageos/init:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
      - name: Login to docker container registry
        uses: docker/login-action@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_CLI_USERNAME }}
          password: ${{ secrets.DOCKERHUB_CLI_PASSWORD }}
      - name: Build container image
        run: make docker-build
      - name: Push container image to dockerhub
        run: make docker-push
      - name: Tag image with ECR URI
        run: |
          echo "NEW_IMAGE=${{ secrets.ECR_URI }}/init:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
          docker tag ${{ env.IMAGE_TAG }} ${{ env.NEW_IMAGE }}
      - name: Push container image to ECR
        run:  docker push ${{ env.NEW_IMAGE }}
